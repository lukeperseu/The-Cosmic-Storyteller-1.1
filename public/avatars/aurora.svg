<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgAurora" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <clipPath id="circleClipAurora">
      <circle cx="100" cy="100" r="92" />
    </clipPath>
  </defs>

  <!-- Background Circle with Matte Green Glow -->
  <circle cx="100" cy="100" r="98" fill="url(#bgAurora)" stroke="#059669" stroke-width="4" />

  <g clip-path="url(#circleClipAurora)">
    <!-- Cafe Dark Aesthetic Background -->
    <rect x="0" y="0" width="200" height="200" fill="url(#bgAurora)" />

    <!-- Window Rain Strips in Background -->
    <line x1="140" y1="20" x2="130" y2="70" stroke="#10b981" stroke-width="1.5" opacity="0.3"/>
    <line x1="165" y1="10" x2="155" y2="80" stroke="#10b981" stroke-width="1" opacity="0.2"/>
    <line x1="180" y1="30" x2="170" y2="90" stroke="#10b981" stroke-width="1.5" opacity="0.25"/>

    <!-- Coffee Cup on Wooden Table -->
    <ellipse cx="40" cy="165" rx="18" ry="6" fill="#022c22" />
    <path d="M 28 150 L 32 165 C 34 168, 46 168, 48 165 L 52 150 Z" fill="#334155" />
    <!-- Latte Foam -->
    <ellipse cx="40" cy="150" rx="12" ry="3" fill="#fef3c7" />
    <!-- Steam from Coffee -->
    <path d="M 38 145 C 36 138, 42 132, 40 125" stroke="#a7f3d0" stroke-width="1.5" fill="none" opacity="0.6" />

    <!-- Goth Girl Body / Oversized Dark T-Shirt -->
    <path d="M 50 180 C 50 135, 80 125, 105 125 C 130 125, 160 135, 160 180 L 175 200 L 25 200 Z" fill="#0f172a" />
    <!-- T-Shirt Graphic / Stussy style cross -->
    <path d="M 100 142 L 100 158 M 92 150 L 108 150" stroke="#334155" stroke-width="2" />

    <!-- Neck & Necklace -->
    <path d="M 90 100 L 90 125 C 98 128, 107 128, 115 125 L 115 100 Z" fill="#f1f5f9" />
    <!-- Choker / Necklace -->
    <path d="M 90 112 C 100 116, 105 116, 115 112" stroke="#09090b" stroke-width="3" stroke-linecap="round" fill="none" />
    <!-- Pendant -->
    <circle cx="102.5" cy="118" r="2.5" fill="#10b981" />

    <!-- Head Shape (Leaning slightly down, reading) -->
    <path d="M 68 55 C 68 95, 85 115, 105 115 C 125 115, 140 95, 140 55 C 140 38, 125 30, 105 30 C 85 30, 68 38, 68 55 Z" fill="#f8fafc" />

    <!-- Downward Looking Anime Eye (Goth subtle style) -->
    <!-- Left Eye -->
    <ellipse cx="85" cy="72" rx="7" ry="8" fill="#0f172a" />
    <ellipse cx="85" cy="74" rx="5" ry="5" fill="#059669" />
    <circle cx="83" cy="70" r="2" fill="#ffffff" />
    <!-- Right Eye -->
    <ellipse cx="120" cy="72" rx="7" ry="8" fill="#0f172a" />
    <ellipse cx="120" cy="74" rx="5" ry="5" fill="#059669" />
    <circle cx="118" cy="70" r="2" fill="#ffffff" />

    <!-- Eyelashes & Brows -->
    <path d="M 76 66 C 82 62, 90 62, 94 66" stroke="#09090b" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M 112 66 C 116 62, 124 62, 128 66" stroke="#09090b" stroke-width="2.5" stroke-linecap="round" fill="none" />

    <!-- Nose & Mouth (Focus/Serious expression) -->
    <circle cx="103" cy="82" r="1.2" fill="#64748b" />
    <path d="M 98 90 L 107 90" stroke="#334155" stroke-width="2" stroke-linecap="round" />

    <!-- Messy Short Goth Hair (Dark Black/Charcoal) -->
    <path d="M 60 50 C 50 25, 80 18, 105 18 C 130 18, 150 25, 148 50 C 158 70, 150 95, 145 105 C 138 85, 138 60, 132 50 C 120 40, 90 40, 76 50 C 70 60, 70 85, 63 105 C 58 95, 52 70, 60 50 Z" fill="#09090b" />
    <!-- Front bangs covering forehead partially -->
    <path d="M 72 32 L 80 62 L 90 38 L 102 68 L 112 38 L 122 62 L 132 32" stroke="#1e293b" stroke-width="6" stroke-linecap="round" fill="none" />

    <!-- Book Held in Hands -->
    <!-- Open Book -->
    <path d="M 115 130 C 130 120, 150 120, 165 125 L 165 170 C 150 165, 130 165, 115 175 Z" fill="#f8fafc" stroke="#334155" stroke-width="1" />
    <path d="M 115 130 C 100 120, 80 120, 65 125 L 65 170 C 80 165, 100 165, 115 175 Z" fill="#f1f5f9" stroke="#334155" stroke-width="1" />
    <!-- Book Spine -->
    <line x1="115" y1="130" x2="115" y2="175" stroke="#059669" stroke-width="3" />
    <!-- Fake text lines in book -->
    <line x1="72" y1="138" x2="105" y2="135" stroke="#94a3b8" stroke-width="1" />
    <line x1="72" y1="145" x2="100" y2="142" stroke="#94a3b8" stroke-width="1" />
    <line x1="72" y1="152" x2="105" y2="149" stroke="#94a3b8" stroke-width="1" />
    <line x1="125" y1="135" x2="158" y2="138" stroke="#94a3b8" stroke-width="1" />
    <line x1="125" y1="142" x2="152" y2="145" stroke="#94a3b8" stroke-width="1" />
    <line x1="125" y1="149" x2="158" y2="152" stroke="#94a3b8" stroke-width="1" />
  </g>

  <!-- Outer Ring Badge Accent -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="#34d399" stroke-width="2" opacity="0.8"/>
</svg>
